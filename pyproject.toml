[project]
name = "tin-bitmap-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["certifi>=2026.0.0", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
